<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4 py-8">
  <div class="max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-2xl bg-white shadow-2xl">

    <!-- En-tête -->
    <div class="sticky top-0 z-10 flex items-start justify-between border-b border-gray-100 bg-white px-6 py-5">
      <div>
        <h2 class="text-xl font-bold text-gray-900">Nouveau projet</h2>
        <p class="mt-1 text-sm text-gray-500">Renseigne les informations du projet et assigne une équipe</p>
      </div>
      <button type="button" class="rounded-lg p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600"
        aria-label="Fermer" (click)="fermerForm()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="soumettre()" class="px-6 py-5">

      <!-- Nom du projet -->
      <div class="mb-4">
        <label for="nom" class="mb-1.5 block text-sm font-medium text-gray-700">
          Nom du projet <span class="text-red-500">*</span>
        </label>
        <input id="nom" type="text" formControlName="nom" placeholder="Ex: Refonte plateforme RH"
          class="w-full rounded-lg border px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
          [class.border-gray-200]="!champInvalide('nom')" [class.border-red-400]="champInvalide('nom')" />
        <p *ngIf="champInvalide('nom')" class="mt-1 text-xs text-red-600">
          Le nom du projet est requis (3 caractères minimum).
        </p>
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label for="description" class="mb-1.5 block text-sm font-medium text-gray-700">
          Description
        </label>
        <textarea id="description" formControlName="description" rows="3"
          placeholder="Décris le contexte et le périmètre du projet"
          class="w-full resize-none rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Objectifs -->
      <div class="mb-4">
        <label for="objectifs" class="mb-1.5 block text-sm font-medium text-gray-700">
          Objectifs
        </label>
        <textarea id="objectifs" formControlName="objectifs" rows="2"
          placeholder="Ex: Réduire le temps de traitement de 30%, migrer vers l'architecture REST..."
          class="w-full resize-none rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <!-- Dates -->
      <div class="mb-4 grid grid-cols-2 gap-4">
        <div>
          <label for="dateDebut" class="mb-1.5 block text-sm font-medium text-gray-700">
            Date de début <span class="text-red-500">*</span>
          </label>
          <input id="dateDebut" type="date" formControlName="dateDebut"
            class="w-full rounded-lg border px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
            [class.border-gray-200]="!champInvalide('dateDebut')" [class.border-red-400]="champInvalide('dateDebut')" />
        </div>
        <div>
          <label for="dateFinPrevue" class="mb-1.5 block text-sm font-medium text-gray-700">
            Échéance prévue <span class="text-red-500">*</span>
          </label>
          <input id="dateFinPrevue" type="date" formControlName="dateFinPrevue"
            class="w-full rounded-lg border px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
            [class.border-gray-200]="!champInvalide('dateFinPrevue')"
            [class.border-red-400]="champInvalide('dateFinPrevue')" />
        </div>
      </div>

      <!-- Niveau de priorité -->
      <div class="mb-4">
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Niveau de priorité</label>
        <div class="flex gap-2">
          <button *ngFor="let priorite of priorites" type="button" (click)="selectPriorite(priorite)"
            [ngClass]="form.value.niveauPriorite === priorite ? mapPrioriteDesign[priorite] : ''"
            class="rounded-full border border-gray-200 bg-white px-3 py-1 text-xs font-medium text-gray-500 hover:bg-gray-50">
            {{ priorite }}
          </button>
        </div>
      </div>

      <!-- Statut initial -->
      <div class="mb-5">
        <label class="mb-1.5 block text-sm font-medium text-gray-700">Statut initial</label>
        <div class="flex gap-2">
          <button *ngFor="let statut of status" type="button" (click)="selectStatut(statut)"
            [ngClass]="form.value.statut === statut ? mapStatutDesign[statut] : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'"
            class="rounded-full px-4 py-1.5 text-sm font-medium transition-colors">
            {{ statut }}
          </button>
        </div>
      </div>

      <!-- Chef de projet : visible uniquement pour un administrateur -->
      <div *ngIf="loggedinPerson?.role === 'ADMINISTRATEUR'" class="mb-5">
        <label class="mb-2 block text-sm font-medium text-gray-700">
          Chef de projet <span class="text-red-500">*</span>
        </label>
        <div class="max-h-44 overflow-y-auto rounded-lg border border-gray-200">
          <button *ngFor="let chef of chefsProjets" type="button" (click)="selectChef(chef)"
            [ngClass]="form.value.chefProjet === chef.id ? 'bg-blue-50' : 'hover:bg-gray-50'"
            class="flex w-full items-center gap-3 border-b border-gray-100 px-3 py-2 text-left last:border-b-0">
            <span
              class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-teal-600 text-[10px] font-semibold text-white">
              {{ chef.nom.charAt(0) + chef.prenom.charAt(0) }}
            </span>
            <span class="flex-1 text-sm text-gray-800">{{ chef.nom }} {{ chef.prenom }}</span>
            <span class="flex h-4 w-4 shrink-0 items-center justify-center rounded-full border-2 border-blue-600">
              <span *ngIf="form.value.chefProjet === chef.id" class="h-2 w-2 rounded-full bg-blue-600"></span>
            </span>
          </button>

          <p *ngIf="!chefsProjets.length" class="px-3 py-2 text-sm text-gray-400">
            Aucun chef de projet disponible.
          </p>
        </div>
        <p *ngIf="champInvalide('chefProjetId')" class="mt-1 text-xs text-red-600">
          Sélectionne un chef de projet.
        </p>
      </div>
      <!-- CHEF_Projet -->
      

  <!-- Équipe du projet — sélection multiple via le Set, groupée par pôle -->
  <div class="mb-6">
    <label class="mb-2 block text-sm font-medium text-gray-700">Équipe du projet</label>
    <div class="max-h-64 overflow-y-auto rounded-lg border border-gray-200">

      <div *ngFor="let equipe of equipes">
        <div class="sticky top-0 bg-gray-50 px-3 py-1.5 text-xs font-semibold uppercase tracking-wide text-gray-500">
          {{ equipe.nom }}
        </div>

        <button *ngFor="let membre of equipe.members" type="button" (click)="toggleMembre(membre.id)"
          [ngClass]="membresSelectionnes.has(membre.id) ? 'bg-blue-50' : 'hover:bg-gray-50'"
          class="flex w-full items-center gap-3 border-b border-gray-100 px-3 py-2 text-left">
          <span class="flex h-4 w-4 shrink-0 items-center justify-center rounded border-2"
            [ngClass]="membresSelectionnes.has(membre.id) ? 'border-blue-600 bg-blue-600' : 'border-gray-300'">
            <svg *ngIf="membresSelectionnes.has(membre.id)" xmlns="http://www.w3.org/2000/svg"
              class="h-3 w-3 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </span>

          <span
            class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-teal-600 text-[10px] font-semibold text-white">
            {{ membre.nom.charAt(0) + membre.prenom.charAt(0) }}
          </span>
          <span class="flex-1 text-sm text-gray-800">{{ membre.nom }} {{ membre.prenom }}</span>
        </button>

        <p *ngIf="!equipe.members.length" class="px-3 py-2 text-sm text-gray-400">
          Aucun membre dans ce pôle.
        </p>
      </div>

      <p *ngIf="!equipes.length" class="px-3 py-2 text-sm text-gray-400">
        Chargement des équipes...
      </p>
    </div>
  </div>

  <!-- Pied de formulaire -->
  <div class="flex justify-end gap-3 border-t border-gray-100 pt-4">
    <button type="button" (click)="fermerForm()"
      class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
      Annuler
    </button>
    <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
      Créer le projet
    </button>
  </div>
  </form>
</div>
</div>
