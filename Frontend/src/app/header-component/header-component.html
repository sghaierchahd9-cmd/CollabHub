<div class="bg-white border-b border-[#E2EAF0] sticky top-0 z-10">
    <div class="flex items-center justify-between py-3.5 px-4 md:px-8">
        <div class="flex items-center gap-3 min-w-0">
            <!-- Bouton hamburger, visible seulement < md -->
            <button
                class="md:hidden shrink-0 p-1.5 -ml-1 rounded-lg hover:bg-[#f0f4f8]"
                (click)="sidebarState.toggle()">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M2 5h16M2 10h16M2 15h16" stroke="#0F1923" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <div class="min-w-0">
                <h1 class="m-0 font-['Plus_Jakarta_Sans'] font-bold text-xl text-[#0F1923] tracking-[-0.4px] truncate">{{ title }}</h1>
                <p class="m-0 text-[#6B7F8E] text-[13px] truncate">{{ subtitle }}</p>
            </div>
        </div>

        <div class="flex items-center gap-2.5 shrink-0">
           <app-notification-bell-component></app-notification-bell-component>
            <button *ngIf="actionButtonText != ''" class="bg-[#3a7ca5] text-white border-none rounded-lg px-[18px] py-[9px] font-semibold text-[13px] cursor-pointer font-['Inter',sans-serif] flex items-center gap-1.5 whitespace-nowrap" (click)="onActionButtonClick()">
              <svg *ngIf="ajout" width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 1v12M1 7h12" stroke="white" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <svg *ngIf="modifier" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>
              </svg>
              {{ actionButtonText }}
            </button>
        </div>
    </div>
</div>
