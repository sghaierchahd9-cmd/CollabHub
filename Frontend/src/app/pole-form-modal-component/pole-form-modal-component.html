<div *ngIf="isOpen" class="fixed inset-0 z-[60] flex items-center justify-center px-4">
  <div class="fixed inset-0 bg-slate-900/40" (click)="onClose()"></div>
  <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md px-6 py-6">
    <h2 class="font-bold text-lg text-slate-900 mb-4">
      {{ modeEdition ? 'Modifier le pôle' : 'Créer un pôle' }}
    </h2>

    <div class="mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-1">Nom</label>
      <input [(ngModel)]="nom" type="text" placeholder="ex : Backend Team"
        class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" />
    </div>

    <div class="mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-1">Description</label>
      <textarea [(ngModel)]="description" rows="3"
        class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></textarea>
    </div>

    <p *ngIf="erreur" class="text-sm text-red-600 mb-3">{{ erreur }}</p>

    <div class="flex gap-3">
      <button (click)="onClose()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-semibold text-sm">
        Annuler
      </button>
      <button (click)="onSubmit()" [disabled]="enCours || !nom.trim()"
        class="flex-1 py-2.5 rounded-xl bg-[#3a7ca5] text-white font-semibold text-sm disabled:opacity-60">
        {{ enCours ? 'Enregistrement...' : (modeEdition ? 'Enregistrer' : 'Créer') }}
      </button>
    </div>
  </div>
</div>
