<!-- layout.component.html -->
<div class="flex">
  <app-sidebar-component (deconnexionDemandee)="showLogoutConfirm.set(true)"></app-sidebar-component>
  <main class="flex-1  min-w-0 overflow-hidden">
    <router-outlet></router-outlet>
  </main>
</div>


  <div *ngIf="showLogoutConfirm()" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-80 shadow-lg">
      <p class="text-gray-800 font-medium mb-4">Voulez-vous vraiment vous déconnecter ?</p>
      <div class="flex justify-end gap-3">
        <button (click)="annulerDeconnexion()" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100">
          Annuler
        </button>
        <button (click)="confirmerDeconnexion()" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700">
          Déconnexion
        </button>
      </div>
    </div>
  </div>
