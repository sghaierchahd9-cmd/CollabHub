<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
  <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden flex">


    <div class="hidden md:flex md:w-1/2 bg-[#0f2942] flex-col justify-between p-8 text-white">
      <div class="flex items-center gap-2">
        <svg viewBox="0 0 180 180" class="w-8 h-8" fill="none">
          <path d="M45 90 L75 120 L135 52.5" stroke="#6FD4B8" stroke-width="14" stroke-linecap="round"
            stroke-linejoin="round" />
          <circle cx="45" cy="90" r="16" fill="#F4F6F8" />
          <circle cx="75" cy="120" r="16" fill="#F4F6F8" />
          <circle cx="135" cy="52.5" r="16" fill="#F4F6F8" />
        </svg>
        <span class="text-xl font-bold">CollabHub</span>
      </div>


      <h2 class="text-2xl font-bold leading-snug mb-2">
        Gérez vos projets et vos équipes, ensemble.
      </h2>
      <p class="text-sm text-slate-300">
        Plateforme collaborative de gestion de projets hybrides.
      </p>



    </div>

    <!-- Formulaire (droite) -->
    <div class="w-full md:w-1/2 flex flex-col justify-center px-8 py-12 sm:px-12">
      <div class="max-w-sm w-full mx-auto">

        <h1 class="text-2xl font-bold text-gray-900 mb-1">Bon retour</h1>
        <p class="text-sm text-gray-500 mb-6">Connectez-vous avec votre email professionnel.</p>

        <div *ngIf="errorMessage"
          class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 mb-4">
          {{ errorMessage }}
        </div>

        <form #form="ngForm" (ngSubmit)="login(form)" class="space-y-4">

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <div class="relative">
              <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input type="text" id="email" name="email" ngModel placeholder="prenom.nom@collabhub.com"
                class="w-full rounded-lg border border-gray-300 pl-10 pr-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:outline-none" />
            </div>
          </div>

          <!-- Mot de passe -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input [type]="motDePasseVisible ? 'text' : 'password'" id="password" name="password" ngModel
                placeholder="••••••••"
                class="w-full rounded-lg border border-gray-300 pl-10 pr-10 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:outline-none" />
              <button type="button" (click)="motDePasseVisible = !motDePasseVisible"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <i class="fas" [ngClass]="motDePasseVisible ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <div class="text-right">
            <a routerLink="/forgot-password" class="text-blue-600 text-sm hover:underline">
              Mot de passe oublié ?
            </a>
          </div>

          <button type="submit"
            class="w-full bg-[#2338A6] text-white rounded-lg py-2.5 text-sm font-semibold hover:bg-blue-700 transition flex items-center justify-center gap-2">
            Se connecter
            <i class="fas fa-arrow-right text-xs"></i>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
