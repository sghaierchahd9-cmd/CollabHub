 <div class="bg-white rounded-xl px-6 py-5 border border-slate-200 h-full flex flex-col">
      
      <h3 class="mb-4 font-sans font-bold text-[15px] text-slate-900">
        Équipes
      </h3>

      <div class="flex-1 overflow-y-auto space-y-4">
        <div *ngFor="let equipe of equipes; let i = index" 
             class="rounded-lg border border-slate-100 bg-slate-50/60 p-3.5">
          
          <div class="flex items-center justify-between mb-3">
            <span class="text-sm font-semibold text-slate-800">{{ equipe.nom }}</span>
            <span class="text-xs text-slate-400">{{ equipe.members.length }} membre{{ equipe.members.length > 1 ? 's' : '' }}</span>
          </div>

          <div class="flex flex-wrap gap-2">
            <div *ngFor="let membre of equipe.members" 
                 class="flex items-center gap-1.5 bg-white border border-slate-200 rounded-full pl-1 pr-3 py-1">
              <span 
                class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-semibold text-white shrink-0"
                [style.background-color]="getColor(membre.nom)">
                {{ getInitiales(membre) }}
              </span>
              <span class="text-xs text-slate-700 font-medium whitespace-nowrap">
                {{ membre.prenom }} {{ membre.nom }}
              </span>
            </div>
          </div>

        </div>
      </div>

    </div>
