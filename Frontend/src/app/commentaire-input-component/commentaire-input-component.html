<div class="relative">
  <textarea [(ngModel)]="texte" (ngModelChange)="onSaisie()" rows="2" [placeholder]="placeholder"
    class="w-full resize-none rounded-lg border border-gray-200 px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>

  <div *ngIf="suggestionsVisibles"
    class="absolute z-10 mt-1 w-56 overflow-hidden rounded-lg border border-gray-100 bg-white shadow-lg">
     <button *ngIf="optionTousVisible" type="button" (click)="selectionnerTous()"
      class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm hover:bg-gray-50 border-b border-gray-100">
      <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-purple-600 text-[11px] font-semibold text-white">
        @
      </span>
      <span class="font-medium">Tous les membres</span>
    </button>
    <button *ngFor="let membre of suggestionsFiltrees" type="button" (click)="selectionnerMention(membre)"
      class="flex w-full items-center gap-2 px-2 py-2 text-left text-sm hover:bg-gray-50">
      <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-teal-600 text-[9px] font-semibold text-white">
        {{ membre.nom.charAt(0) + membre.prenom.charAt(0) }}
      </span>
      {{ membre.nom }} {{ membre.prenom }} : {{ membre.role }}
    </button>
  </div>

  <div class="mt-2 flex justify-end">
    <button type="button" (click)="envoyerCommentaire()" [disabled]="!texte.trim()"
      class="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
      Envoyer
    </button>
  </div>
</div>
