<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
<div class="bg-white rounded-2xl w-[520px] max-w-[95vw] shadow-2xl overflow-hidden">

  <!-- Header -->
  <div class="px-6 pt-5 pb-4 border-b border-slate-200 flex justify-between items-center">
    <div>
      <h2 class="text-[17px] font-bold text-slate-900">Modifier la tâche</h2>
      <p class="text-xs text-slate-500 mt-0.5">Mettre à jour les informations de la tâche</p>
    </div>
    <button type="button" (click)="onAnnuler()" class="text-slate-500 hover:bg-slate-100 rounded-md p-1">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!succes">
    <div class="px-6 py-5 flex flex-col gap-4 max-h-[65vh] overflow-y-auto">

      <!-- Titre -->
      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1.5 block tracking-wide">TITRE DE LA TÂCHE *</label>
        <input
          formControlName="titre"
          placeholder="Ex: Intégration formulaire de profil"
          class="w-full px-3 py-2 rounded-lg text-sm bg-slate-50 outline-none border transition-colors"
          [class.border-red-400]="titreInvalide"
          [class.border-slate-300]="!titreInvalide" />
        @if (titreInvalide) {
          <p class="text-xs text-red-500 mt-1">Le titre est obligatoire</p>
        }
      </div>

      <!-- Description -->
      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1.5 block tracking-wide">DESCRIPTION</label>
        <textarea
          formControlName="description"
          rows="3"
          placeholder="Décrivez la tâche, contexte, contraintes..."
          class="w-full px-3 py-2 rounded-lg text-sm bg-slate-50 border border-slate-300 outline-none resize-y min-h-[72px]"></textarea>
      </div>

      <!-- Priorité / Statut -->
      <div class="grid grid-cols-2 gap-3.5">
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1.5 block tracking-wide">PRIORITÉ</label>
          <select formControlName="priorite" class="w-full px-3 py-2 rounded-lg text-sm bg-slate-50 border border-slate-300 outline-none cursor-pointer">
            @for (p of priorites; track p.valeur) {
              <option [value]="p.valeur">{{ p.emoji }} {{ p.label }}</option>
            }
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600 mb-1.5 block tracking-wide">STATUT</label>
          <select formControlName="statut" class="w-full px-3 py-2 rounded-lg text-sm bg-slate-50 border border-slate-300 outline-none cursor-pointer">
            @for (s of statuts; track s.valeur) {
              <option [value]="s.valeur">{{ s.label }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Assigné à -->
      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1.5 block tracking-wide">ASSIGNÉ À *</label>
        <div class="flex flex-wrap gap-2">
          @for (membre of equipeProjet; track membre.id) {
            <button
              type="button"
              (click)="toggleCollaborateur(membre)"
              class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm border transition-colors"
              [class.border-blue-500]="estSelectionne(membre)"
              [class.bg-blue-50]="estSelectionne(membre)"
              [class.border-slate-300]="!estSelectionne(membre)">
              <div
                class="w-[22px] h-[22px] rounded-full text-white flex items-center justify-center text-[8px] font-semibold border-2 border-white flex-shrink-0"
                [style.background-color]="couleurAvatar(membre.id)">
                {{ initiales(membre) }}
              </div>
              {{ membre.prenom }}
              @if (estSelectionne(membre)) {
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                  <path d="M2 6l3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              }
            </button>
          }
        </div>
        @if (form.touched && aucunCollaborateurSelectionne) {
          <p class="text-xs text-red-500 mt-1">Sélectionnez au moins un collaborateur</p>
        }
      </div>

      <!-- Échéance -->
      <div>
        <label class="text-xs font-semibold text-slate-600 mb-1.5 block tracking-wide">DATE D'ÉCHÉANCE *</label>
        <input
          type="date"
          formControlName="echeance"
          class="w-full px-3 py-2 rounded-lg text-sm bg-slate-50 border border-slate-300 outline-none" />
      </div>

    </div>

    <!-- Footer -->
    <div class="px-6 py-3.5 border-t border-slate-200 flex justify-end gap-2.5">
      <button type="button" (click)="onAnnuler()" class="px-5 py-2 rounded-lg border border-slate-300 bg-white text-slate-600 text-sm font-medium">
        Annuler
      </button>
      <button type="submit" class="px-5 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold flex items-center gap-1.5">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 7l3.5 3.5L12 3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Enregistrer les modifications
      </button>
    </div>
  </form>

  <!-- Confirmation -->
  <div *ngIf="succes" class="px-6 py-6 text-center space-y-4">
    <div class="mx-auto w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
      <span class="text-green-600 text-xl">✓</span>
    </div>
    <h3 class="text-lg font-bold text-gray-900">Tâche modifiée avec succès</h3>

    <button type="button" (click)="onClose()"
            class="w-full px-4 py-2 text-sm rounded-lg bg-blue-600 text-white hover:bg-blue-700">
      Terminé
    </button>
  </div>
</div>
</div>
