<!-- repartition-taches.component.html -->
<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
  <h3 class="text-base font-semibold text-slate-900 mb-4">{{title}}</h3>

  <div class="max-w-[220px] mx-auto my-6">
    <canvas
      baseChart
      [data]="doughnutChartData"
      [options]="doughnutChartOptions"
      type="doughnut">
    </canvas>
  </div>

  <div class="flex justify-center flex-wrap gap-4 text-sm text-slate-600">
    <span *ngFor="let label of labels; let i = index " class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full " [style.background-color]="colors[i]"></span> {{label}}
    </span>
   
  </div>
</div>
