<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center" (click)="onFermer()">
  <div class=" relative bg-white rounded-2xl p-6 w-[480px] max-h-[80vh] flex flex-col" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-[15px] font-semibold text-[#0f1923] font-['Inter',sans-serif]">
        Pieces jointes
      </h3>
      <button (click)="onFermer()"
        class="bg-transparent border-none cursor-pointer text-[#6b7f8e] hover:text-[#0f1923] p-1">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <!-- Bouton upload -->
    <label
      class="flex items-center justify-center gap-2 border border-dashed border-[#3a7ca5] text-[#3a7ca5] rounded-lg py-2.5 mb-4 cursor-pointer text-[13px] font-semibold font-['Inter',sans-serif] hover:bg-[#f0f7fb] transition-colors"
      [class.opacity-50]="uploadEnCours" [class.pointer-events-none]="uploadEnCours">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 1v12M1 7h12" stroke="#3a7ca5" stroke-width="2" stroke-linecap="round" />
      </svg>
      {{ uploadEnCours ? 'Envoi en cours...' : 'Ajouter une piece jointe' }}
      <input type="file" class="hidden" (change)="onFileSelected($event)" [disabled]="uploadEnCours">
    </label>

    <p *ngIf="erreurUpload" class="text-[12px] text-red-600 -mt-2.5 mb-3">{{ erreurUpload }}</p>
    <p *ngIf="erreurRenommage" class="text-[12px] text-red-600 -mt-2.5 mb-3">{{ erreurRenommage }}</p>
    <!-- Liste -->
    <div class="flex-1 overflow-y-auto flex flex-col gap-2">

      <div *ngIf="chargement" class="text-center text-[13px] text-[#6b7f8e] py-6">
        Chargement...
      </div>

      <div *ngIf="erreurChargement" class="text-center text-[13px] text-red-600 py-6">
        Impossible de charger les pieces jointes.
      </div>

      <div *ngIf="!chargement && !erreurChargement && piecesJointes.length === 0"
        class="text-center text-[13px] text-[#6b7f8e] py-6">
        Aucune piece jointe pour cette tache.
      </div>

      <div *ngFor="let pj of piecesJointes"
        class="flex items-center justify-between gap-2 border border-[#e2eaf0] rounded-lg px-3 py-2.5">

        <!-- Mode edition -->
        <div *ngIf="pieceEnEdition === pj.id" class="flex items-center gap-1.5 flex-1 min-w-0">
          <i [class]="getIconeFichier(pj.nomFichier) + ' text-[#3a7ca5] text-[15px] shrink-0'"></i>
          <input type="text" [(ngModel)]="nomEdition" [disabled]="renommageEnCours"
            class="flex-1 min-w-0 text-[13px] border border-[#3a7ca5] rounded px-1.5 py-0.5 font-['Inter',sans-serif] focus:outline-none"
            (keyup.enter)="onValiderRenommage(pj)" (keyup.escape)="onAnnulerRenommage()">
          <span class="text-[13px] text-[#6b7f8e] shrink-0">{{ getExtension(pj.nomFichier) }}</span>

          <button (click)="onValiderRenommage(pj)" [disabled]="renommageEnCours"
            class="bg-transparent border-none cursor-pointer text-green-600 hover:text-green-700 p-1 shrink-0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </button>
          <button (click)="onAnnulerRenommage()" [disabled]="renommageEnCours"
            class="bg-transparent border-none cursor-pointer text-[#6b7f8e] hover:text-red-600 p-1 shrink-0">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <!-- Mode normal -->
        <ng-container *ngIf="pieceEnEdition !== pj.id">
          <button (click)="onTelecharger(pj)"
            class="flex items-center gap-2.5 flex-1 min-w-0 bg-transparent border-none cursor-pointer text-left">
            <i [class]="getIconeFichier(pj.nomFichier) + ' text-[#3a7ca5] text-[15px] shrink-0'"></i>
            <div class="min-w-0">
              <p class="m-0 text-[13px] font-medium text-[#0f1923] truncate">{{ pj.nomFichier }}</p>
              <p class="m-0 text-[11px] text-[#6b7f8e]">{{ pj.dateUpload | date:'dd/MM/yyyy HH:mm' }}</p>
            </div>
          </button>

          <button *ngIf="peutSupprimer(pj)" (click)="onDemarrerRenommage(pj)"
            class="bg-transparent border-none cursor-pointer text-[#6b7f8e] hover:text-[#3a7ca5] p-1 shrink-0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
            </svg>
          </button>
     
            <button *ngIf="peutSupprimer(pj)" (click)="demandeSuppression(pj)"
              class="bg-transparent border-none cursor-pointer text-[#6b7f8e] hover:text-red-600 p-1 shrink-0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z" />
              </svg>
            </button>
          
        </ng-container>
      </div>
        <!-- Confirmation -->
            <div *ngIf="confirmationOuverte"
              class="absolute right-0 bg-white shadow-lg rounded-xl border border-gray-100 z-10 w-64 p-4">
              <div class="flex items-start gap-2.5 mb-3">
                <div
                  class="w-7 h-7 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center shrink-0 mt-0.5">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M12 9v4M12 17h.01M10.29 3.86l-8.18 14.18A2 2 0 0 0 3.82 21h16.36a2 2 0 0 0 1.71-3l-8.18-14.14a2 2 0 0 0-3.42 0z" />
                  </svg>
                </div>
                <p class="text-[13px] text-[#0f1923] leading-snug m-0">
                  Retirer <span class="font-semibold">{{selectedPJ?.nomFichier }} </span> ?
                </p>
              </div>
              <div class="flex justify-end gap-2">
                <button (click)="confirmationOuverte=false"
                  class="text-xs font-medium text-slate-500 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition-colors">
                  Annuler
                </button>
                <button (click)="onSupprimer()"
                  class="text-xs font-semibold bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-lg transition-colors">
                  Confirmer
                </button>
              </div>
            </div>
         
    </div>
  </div>
</div>
