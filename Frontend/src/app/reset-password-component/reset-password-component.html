<!-- reset-password.component.html -->
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">

    <div *ngIf="tokenAbsent" class="text-center">
      <h1 class="text-2xl font-bold mb-2">Lien invalide</h1>
      <p class="text-gray-500 mb-6">Ce lien de réinitialisation est incomplet ou incorrect.</p>
      <a routerLink="/forgot-password" class="text-blue-600 font-medium">Refaire une demande</a>
    </div>

    <div *ngIf="!tokenAbsent && !succes">
      <h1 class="text-2xl font-bold mb-2">Nouveau mot de passe</h1>
      <p class="text-gray-500 mb-6">Choisissez un nouveau mot de passe pour votre compte.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label class="block text-sm font-medium mb-1">Nouveau mot de passe</label>
        <input type="password" formControlName="nouveauMotDePasse"
               class="w-full border rounded-lg px-3 py-2 mb-4" />

        <label class="block text-sm font-medium mb-1">Confirmer le mot de passe</label>
        <input type="password" formControlName="confirmation"
               class="w-full border rounded-lg px-3 py-2 mb-1" />
        <p *ngIf="form.errors?.['mismatch'] && form.get('confirmation')?.touched"
           class="text-red-500 text-sm mb-4">
          Les mots de passe ne correspondent pas
        </p>

        <p *ngIf="erreur" class="text-red-500 text-sm mb-4">{{ erreur }}</p>

        <button type="submit" [disabled]="form.invalid || chargement"
                class="w-full bg-blue-700 text-white rounded-lg py-2 font-medium disabled:opacity-50">
          {{ chargement ? 'Mise à jour...' : 'Réinitialiser le mot de passe' }}
        </button>
      </form>
    </div>

    <div *ngIf="succes" class="text-center">
      <h1 class="text-2xl font-bold mb-2">Mot de passe mis à jour</h1>
      <p class="text-gray-500">Redirection vers la connexion...</p>
    </div>

  </div>
</div>
