<div
  class="rounded-full flex items-center justify-center overflow-hidden shrink-0 text-white font-semibold"
  [ngClass]="classesTaille + ' ' + classeCouleur" 
>
  <img
    *ngIf="urlComplete as url"
    [src]="url"
    (error)="onImageError()"
    alt="Photo de profil de {{ prenom }} {{ nom }}"
    class="w-full h-full object-cover"
  />
  <span *ngIf="!urlComplete" >{{ initiales }}</span>
</div>
