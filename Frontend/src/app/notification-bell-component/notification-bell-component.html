<div class="relative">
  <button
    class="bg-none border-none cursor-pointer text-[#6B7F8E] p-1 relative"
    (click)="toggleDropdown($event)">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M9 2a5 5 0 00-5 5v3l-1.5 2.5h13L14 10V7a5 5 0 00-5-5z" stroke="currentColor" stroke-width="1.5"></path>
      <path d="M7 14.5a2 2 0 004 0" stroke="currentColor" stroke-width="1.5"></path>
    </svg>
    @if (unreadCount > 0) {
      <span class="absolute top-0.5 right-0.5 min-w-[14px] h-[14px] px-[3px] rounded-full bg-[#E05252] border-[1.5px] border-white text-white text-[9px] leading-[10px] flex items-center justify-center">
        {{ unreadCount > 9 ? '9+' : unreadCount }}
      </span>
    }
  </button>

  @if (isOpen) {
    <div class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl border border-[#E2EAF0] max-h-96 overflow-y-auto z-20">
      <div class="px-4 py-3 border-b border-[#E2EAF0] font-semibold text-sm text-[#0F1923]">
        Notifications
      </div>
      @if (notifications.length === 0) {
        <p class="px-4 py-6 text-center text-sm text-[#6B7F8E]">Aucune notification</p>
      }
      @for (notif of notifications; track notif.id) {
        <div
          class="px-4 py-3 border-b border-[#E2EAF0] last:border-0 cursor-pointer hover:bg-[#F5F8FA]"
          [ngClass]="{'bg-[#EFF6FB]': !notif.estLue}"
          (click)="onNotificationClick(notif)">
        <p class="text-xs font-semibold uppercase"
     [ngClass]="urgente(notif.typeEvenement) ? 'text-red-600' : 'text-[#3a7ca5]'">
    {{ libelle(notif.typeEvenement) }}
  </p>
          <p class="text-sm text-[#0F1923] mt-0.5">{{ notif.message }}</p>
          <p class="text-[11px] text-[#6B7F8E] mt-1">{{ notif.dateGeneration | date:'short' }}</p>
        </div>
      }
    </div>
  }
</div>
