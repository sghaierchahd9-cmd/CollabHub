<div class="bg-white rounded-xl p-5 border border-gray-200">

  <div class="flex items-center gap-3 mb-3.5">
    <app-avatar-component [nom]="membre.nom" [prenom]="membre.prenom" [photoProfilUrl]="membre.photoProfilUrl ?? null"
      taille="md" />
    <div>
      <p class="m-0 font-bold text-[15px] text-[#0f1923]">{{ membre.nom }} {{ membre.prenom }}</p>
      <div class="flex items-center gap-2">
        <span class="bg-[#dbeeff] text-[#2f6690] rounded-full px-2.5 py-0.5 text-xs font-semibold whitespace-nowrap">
          {{ membre.role }}
        </span>
        <span class="w-1.5 h-1.5 rounded-full" [ngClass]="statutConfig(membre.statutActivite ).dotClass"></span>
        <span class="text-[#2f6690] text-xs">{{ statutConfig(membre.statutActivite).label }}</span>
      </div>
    </div>


    <div *ngIf="currentUserRole != 'COLLABORATEUR'" class="relative ml-auto">
      <button class="bg-transparent border-none cursor-pointer text-slate-400 p-1 rounded hover:bg-slate-100"
        (click)="toggleMenu()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="3.5" r="1.2" fill="currentColor"></circle>
          <circle cx="8" cy="8" r="1.2" fill="currentColor"></circle>
          <circle cx="8" cy="12.5" r="1.2" fill="currentColor"></circle>
        </svg>
      </button>

      <!-- Menu contextuel -->
      <div *ngIf="menuOuvert"
        class="absolute right-0 top-6 bg-white shadow-lg rounded-xl border border-gray-100 z-20 py-1.5 w-52">
        <button *ngIf="peutVoirDetails" (click)="onVoirDetails()"
          class="flex items-center gap-2.5 px-3.5 py-2 text-[13px] font-medium text-[#0f1923] hover:bg-slate-50 w-full text-left transition-colors rounded-lg mx-1 my-0.5"
          style="width: calc(100% - 8px);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          Voir détails
        </button>
        <button (click)="demanderConfirmation()"
          class="flex items-center gap-2.5 px-3.5 py-2 text-[13px] font-medium text-rose-600 hover:bg-rose-50 w-full text-left transition-colors rounded-lg mx-1 my-0.5"
          style="width: calc(100% - 8px);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
          Désaffecter membre
        </button>
      </div>

      <!-- Confirmation -->
      <div *ngIf="confirmationOuverte"
        class="absolute right-0 top-6 bg-white shadow-lg rounded-xl border border-gray-100 z-20 w-64 p-4">
        <div class="flex items-start gap-2.5 mb-3">
          <div class="w-7 h-7 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center shrink-0 mt-0.5">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M12 9v4M12 17h.01M10.29 3.86l-8.18 14.18A2 2 0 0 0 3.82 21h16.36a2 2 0 0 0 1.71-3l-8.18-14.14a2 2 0 0 0-3.42 0z" />
            </svg>
          </div>
          <p class="text-[13px] text-[#0f1923] leading-snug m-0">
            Retirer <span class="font-semibold">{{ membre.prenom }} {{ membre.nom }}</span> du projet ?
          </p>
        </div>
        <div class="flex justify-end gap-2">
          <button (click)="annuler()"
            class="text-xs font-medium text-slate-500 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition-colors">
            Annuler
          </button>
          <button (click)="confirmerDesaffectation()"
            class="text-xs font-semibold bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-lg transition-colors">
            Confirmer
          </button>
        </div>
      </div>
    </div>
  </div>
<div class="flex flex-col mb-3 gap-1">
  <div class="flex items-center gap-2 text-xs text-[#6b7f8e]">
    <svg xmlns="http://www.w3.org/2000/svg" height="15" width="15" viewBox="0 0 512 512">
    <path fill="rgb(176, 182, 189)" d="M61.4 64C27.5 64 0 91.5 0 125.4 0 126.3 0 127.1 .1 128L0 128 0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-256-.1 0c0-.9 .1-1.7 .1-2.6 0-33.9-27.5-61.4-61.4-61.4L61.4 64zM464 192.3L464 384c0 8.8-7.2 16-16 16L64 400c-8.8 0-16-7.2-16-16l0-191.7 154.8 117.4c31.4 23.9 74.9 23.9 106.4 0L464 192.3zM48 125.4C48 118 54 112 61.4 112l389.2 0c7.4 0 13.4 6 13.4 13.4 0 4.2-2 8.2-5.3 10.7L280.2 271.5c-14.3 10.8-34.1 10.8-48.4 0L53.3 136.1c-3.3-2.5-5.3-6.5-5.3-10.7z"/></svg>
 {{ membre.email }} </div>
  <div *ngIf="membre.modeTravail" class="flex items-center gap-2 text-xs text-[#6b7f8e]">
    <svg xmlns="http://www.w3.org/2000/svg" height="15" width="15"
      viewBox="0 0 512 512"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
      <path fill="rgb(176, 182, 189)"
        d="M448 96l0 256-384 0 0-256 384 0zM64 32C28.7 32 0 60.7 0 96L0 352c0 35.3 28.7 64 64 64l144 0-16 48-72 0c-13.3 0-24 10.7-24 24s10.7 24 24 24l272 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-72 0-16-48 144 0c35.3 0 64-28.7 64-64l0-256c0-35.3-28.7-64-64-64L64 32z" />
    </svg>
    mode de travail : {{ membre.modeTravail }}
  </div>
</div>
  <div class="grid grid-cols-2 gap-2">
    <div class="bg-[#f4f6f9] rounded-lg px-3 py-2.5">
      <p class="m-0 text-[11px] text-[#6b7f8e]">Tâches</p>
      <p class="m-0 font-bold text-lg text-[#0f1923]">{{ nbTaches }}</p>
    </div>
    <div class="bg-[#f4f6f9] rounded-lg px-3 py-2.5">
      <p class="m-0 text-[11px] text-[#6b7f8e]">Terminées</p>
      <p class="m-0 font-bold text-lg text-[#0f1923]">{{ nbTacheTerminee }}</p>
    </div>
  </div>
</div>
