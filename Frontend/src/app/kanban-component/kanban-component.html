<!-- kanban.component.html -->
<div class="flex gap-4 p-4 overflow-x-auto">
  <div *ngFor="let colonne of colonnes" class="flex-shrink-0 w-72">

    <div class="flex items-center gap-[7px] mb-3.5">
      <span [class]="'w-2 h-2 rounded-full ' + statusDotStyles[colonne.statut]"></span>
      <span class="font-semibold text-[13px] text-slate-500">{{ colonne.label }}</span>
      <span class="ml-auto bg-slate-100 rounded-xl px-2 py-px text-xs font-semibold text-slate-500">
        {{ colonne.taches.length }}
      </span>
    </div>

    <div
      cdkDropList
      [id]="colonne.statut"
      [cdkDropListData]="colonne.taches"
      [cdkDropListConnectedTo]="idsColonnes"
      (cdkDropListDropped)="onDrop($event)"
      class="min-h-[500px] rounded-lg"
    >
      <div   *ngFor="let tache of colonne.taches" cdkDrag [cdkDragDisabled]="!peutDeplacer(tache)">
        <app-cart-tache-component [tache]="tache" (modifier)="modifier.emit($event) " (mettreAJourAvancement)="tauxAvancement.emit($event)" 
        (ouvrirDetail)="detailTache.emit($event)" 
        (click)="selectedTache.emit(tache)"
        (voirInfos)="voirInfos.emit(tache)"
        (ouvrirPiecesJointes)="piecesJointes.emit($event)" [afficheIcone]="afficheIcone"></app-cart-tache-component>
      </div>
    </div>

  </div>
</div>
