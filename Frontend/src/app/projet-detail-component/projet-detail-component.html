<div class="flex-1 flex flex-col h-screen overflow-hidden min-w-0">
  @if (projet) {
  <app-header-component [title]="projet!.nom" [subtitle]="subtitle"
    [actionButtonText]="connectedUser?.role != 'COLLABORATEUR' ? 'Modifier Projet' :''"
    (clickedbutton)="afficherModalProjet=true" [modifier]="true"></app-header-component>
  <div class="bg-white border-b border-[#e2eaf0] px-4 sm:px-8 py-4 sm:py-6">
    <div class="flex items-start justify-between gap-5 flex-wrap">

      <!-- Colonne gauche : titre, description, progression -->
      <div class="flex-1 min-w-[280px]">
        <div class="flex items-center gap-2.5 mb-2.5">
          <span class="bg-[#dbeeff] text-[#2f6690] rounded-full px-2.5 py-0.5 text-xs font-semibold whitespace-nowrap">
            {{projet.statut}}
          </span>

        </div>

        <p class="mb-4 text-[#4a6070] text-sm leading-relaxed max-w-[520px]">
          {{projet.description}}
        </p>

        <div class="max-w-[400px]">
          <div class="flex justify-between mb-1.5">
            <span class="text-xs text-[#6b7f8e] font-medium">Progression globale</span>
            <span class="text-[13px] font-bold text-[#0f1923]">{{avancement + '%'}}</span>
          </div>
          <div>
            <div class="h-1.5 bg-[#e8eef3] rounded-full overflow-hidden">
              <div class="h-full  bg-[#3a7ca5] rounded-full" [ngStyle]="{ 'width.%': avancement }"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Colonne droite : chef de projet + équipe -->
      <div class="flex flex-col gap-3 min-w-[200px]">
        <div>
          <p class="mb-2 text-[11px] font-semibold text-[#6b7f8e] tracking-wider uppercase">
            priorité
          </p>
          <span class={{PrioriteDesign[projet!.niveauPriorite]}}>
            {{projet.niveauPriorite}}
          </span>
        </div>
        <div>
          <p class="mb-2 text-[11px] font-semibold text-[#6b7f8e] tracking-wider uppercase">
            Chef de projet
          </p>
          <div class="flex items-center gap-2">
            <div
              class="w-8 h-8 rounded-full bg-[#3a7ca5] text-white flex items-center justify-center text-[11.5px] font-semibold border-2 border-white shrink-0">
              {{ChefProjet?.nom!.charAt(0) + ChefProjet?.prenom?.charAt(0)}}
            </div>
            <div>
              <p class="m-0 text-[13px] font-semibold text-[#0f1923]">{{ChefProjet?.nom}} {{ChefProjet?.prenom}}</p>
              <p class="m-0 text-[11px] text-[#6b7f8e]">{{ChefProjet?.email}}</p>
            </div>
          </div>
        </div>


      </div>
    </div>

    <!-- Ligne des 4 stat cards -->
   <div class="grid gap-3 mt-5 [grid-template-columns:repeat(auto-fit,minmax(140px,1fr))]">
      <app-stat-cart-component *ngFor="let carte of cartes" [carte]="carte"></app-stat-cart-component>
    </div>

  </div>
<div class="bg-white border-b border-[#e2eaf0] px-4 sm:px-8 flex gap-0 overflow-x-auto">
    <button
      class="px-[18px] py-2.5 border-b-2 bg-none cursor-pointer font-['Inter',sans-serif] text-sm transition-colors duration-150 whitespace-nowrap"
      [ngClass]="selectedFiltre === 'Aperçu' ? 'font-semibold text-[#3a7ca5] border-[#3a7ca5]' :'border-transparent font-normal text-[#6b7f8e]'"
      (click)="selectedFiltre='Aperçu'">
      Aperçu
    </button>
    <button
      class="px-[18px] py-2.5 border-b-2 bg-none cursor-pointer font-['Inter',sans-serif] text-sm transition-colors duration-150 whitespace-nowrap"
      [ngClass]="selectedFiltre === 'Taches' ? 'font-semibold text-[#3a7ca5] border-[#3a7ca5]' :'border-transparent font-normal text-[#6b7f8e]'"
      (click)="selectedFiltre='Taches'">
      Tâches
      <span class="bg-[#f0f4f8] rounded-[10px] px-[7px] py-px text-[11px] ml-1">{{taches.length}}</span>
    </button>
    <button
      class="px-[18px] py-2.5 border-b-2 bg-none cursor-pointer font-['Inter',sans-serif] text-sm transition-colors duration-150 whitespace-nowrap"
      [ngClass]="selectedFiltre === 'Equipe' ? 'font-semibold text-[#3a7ca5] border-[#3a7ca5]' :'border-transparent font-normal text-[#6b7f8e]'"
      (click)="selectedFiltre='Equipe'">
      Équipe
    </button>
     <button
      class="px-[18px] py-2.5 border-b-2 bg-none cursor-pointer font-['Inter',sans-serif] text-sm transition-colors duration-150 whitespace-nowrap flex items-center gap-1.5"
      [ngClass]="selectedFiltre === 'Discussion' ? 'font-semibold text-[#3a7ca5] border-[#3a7ca5]' :'border-transparent font-normal text-[#6b7f8e]'"
      (click)="selectedFiltre='Discussion'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-6l-4 4v-4z" />
      </svg>
      Discussion
    </button>
  
  </div>


 
  <div class="flex-1 overflow-y-auto p-6 bg-[#EDEEF7]  w-full  border border-[#e2eaf0]">
    <ng-container *ngIf="selectedFiltre ==='Taches'">
      <button *ngIf="connectedUser?.role !='COLLABORATEUR'" (click)="afficherModalTache=true"
        class="bg-[#3a7ca5] text-white border-none rounded-lg px-[30px] py-[9px] font-semibold text-[13px] cursor-pointer font-['Inter',sans-serif] flex items-center gap-1.5"
        (click)="ajouterCollab=true">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1v12M1 7h12" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
        Tache
      </button>
      <app-kanban-component [taches]="taches" (drop)="statChange()" (modifier)="onModifierTache($event) "
        (tauxAvancement)="onOuvrirModalAvancement($event)" [connectedUser]="connectedUser"
        (detailTache)="onOuvreDetailTache($event)" (piecesJointes)="onOuvrirPiecesJointes($event)"
        [afficheIcone]="true"
        (voirInfos)="selectTache($event)">

      </app-kanban-component>
    </ng-container>
    <ng-container *ngIf="selectedFiltre === 'Equipe'">
      <button *ngIf="connectedUser?.role !='COLLABORATEUR'" (click)="ouvrirModalAjoutMembre()"
        class="bg-[#3a7ca5] text-white border-none rounded-lg px-[18px] py-[9px] font-semibold text-[13px] cursor-pointer font-['Inter',sans-serif] flex items-center gap-1.5"
        (click)="ajouterCollab=true">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1v12M1 7h12" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
        Collaborateur
      </button>
     <div class="grid gap-3 mt-5 [grid-template-columns:repeat(auto-fit,minmax(220px,1fr))]">
        <app-carte-menmbre-component *ngFor="let membre of collaborateurs" [membre]="membre"
          [taches]="filtrerTaches(membre)" (desaffecter)="onDesaffecterMembre($event)"
          [currentUserRole]="connectedUser?.role ?? 'COLLABORATEUR'" (voirDetails)="onVoirDetailsMembre($event)">
        </app-carte-menmbre-component>
      </div>
      <app-add-membre-component [isOpen]="modalAjoutMembreOuvert" [equipes]="equipes"
        [membresDejaAjoutes]="projet.collaborateurIds || []" [chefId]="ChefProjet!.id"
        (close)="modalAjoutMembreOuvert = false" (confirmer)="onAjouterMembres($event)">
      </app-add-membre-component>
    </ng-container>
        <ng-container *ngIf="selectedFiltre === 'Discussion'">
      <app-espace-collaboratif-projet-component
        [projetId]="projet.id"
        [membresProjet]="collaborateurs.concat(ChefProjet!)">
      </app-espace-collaboratif-projet-component>
    </ng-container>
    <div *ngIf="selectedFiltre === 'Aperçu'"  class="grid grid-cols-1 lg:grid-cols-2 gap-3">
      <app-repartition-tache-chart-component [colors]="chartLableColors" [labels]="chartLabels" [Data]="chartData"
        [title]="'Répartition des taches'"></app-repartition-tache-chart-component>
      <app-activity-log-component [projetId]="projet.id"></app-activity-log-component>
    </div>
    
  
    <app-add-tache-component *ngIf="afficherModalTache" [equipeProjet]="collaborateurs" [projetId]="projet.id"
      (fermer)="afficherModalTache = false ; succesCreationTache=false" (tacheCreee)="creerTache($event)"
      [succes]="succesCreationTache">
    </app-add-tache-component>
    <app-modifie-tache-component *ngIf="tacheEnEdition" [tache]="tacheEnEdition" [equipeProjet]="collaborateurs"
      [succes]="succesModificationTache" (fermer)="onFermerEdition()"
      (tacheModifiee)="onTacheModifiee($event)"></app-modifie-tache-component>
    <app-detail-membre-projet-component *ngIf="afficherModalDetails && membreSelectionne" [membre]="membreSelectionne"
      [taches]="filtrerTaches(membreSelectionne)" (fermer)="fermerModalDetails()"></app-detail-membre-projet-component>

    <app-modifier-projet-component [isOpen]="afficherModalProjet" [projet]="projet" [equipes]="equipes"
      [loggedinPerson]="connectedUser" [enregistrementEnCours]="enregistrementProjetEnCours"
      [erreurMessage]="erreurProjet" (fermer)="onFermerModalProjet()" (enregistrer)="onEnregistrerProjet($event)">
    </app-modifier-projet-component>
    <app-mettre-ajour-avancement-component [isOpen]="afficherModalAvancement" [tache]="tacheSelectionnee"
      [enregistrementEnCours]="enregistrementAvancementEnCours" [erreurMessage]="erreurAvancement"
      (fermer)="onFermerModalAvancement()" (enregistrer)="onEnregistrerAvancement($event)">

    </app-mettre-ajour-avancement-component>
    <app-tache-detail-component [isOpen]="ouvreDetailTache" [membresProjet]="collaborateurs.concat(ChefProjet ? [ChefProjet] : [])" [tache]="tacheSelectionnee"
      (fermer)="ouvreDetailTache=false"></app-tache-detail-component>
    <app-pieces-jointes-modal-component *ngIf="afficherModalPiecesJointes && tacheSelectionnee"
      [tacheId]="tacheSelectionnee.id" (fermer)="afficherModalPiecesJointes = false">
    </app-pieces-jointes-modal-component>
    <app-tache-infrmation-component *ngIf="afficheInfoTache" [tache]="tacheSelectionnee!" (fermer)="afficheInfoTache=false">

    </app-tache-infrmation-component>
  </div>
  }
